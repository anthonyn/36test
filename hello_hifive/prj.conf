# ── Serial console (keep UART so you can use a terminal AND SystemView) ──
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ── Thread debug ──────────────────────────────────────────────────────────
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y          # lets SystemView show stack usage per thread
CONFIG_DEBUG_THREAD_INFO=y          # exports _thread_info offsets for GDB
CONFIG_DEBUG_OPTIMIZATIONS=y        # -Og: debug-friendly without blowing stacks
CONFIG_STACK_SENTINEL=y             # magic value at stack bottom → early overflow panic

# ── Random number generator ───────────────────────────────────────────────
CONFIG_TEST_RANDOM_GENERATOR=y

# ── SEGGER SystemView ─────────────────────────────────────────────────────
# HAS_SEGGER_RTT is now declared in arch/riscv/Kconfig.core for RISCV_CORE_E31
# (J-Link OB on HiFive1 Rev B is a full J-Link; RTT works over JTAG).
CONFIG_TRACING=y
CONFIG_SEGGER_SYSTEMVIEW=y          # selects USE_SEGGER_RTT, RTT_CONSOLE,
                                    # THREAD_MONITOR, INSTRUMENT_THREAD_SWITCHING

# RTT buffer — 512 B up is the minimum comfortable size for SystemView.
# The 16 KB SRAM on the FE310 is tight; increase if events are dropped.
# Block-if-full so no events are silently dropped when the host is slow.
# RTT buffer — 256 B is enough for console + SystemView on 16 KB SRAM.
# NO_BLOCK_SKIP: if the host isn't draining RTT (e.g. only minicom/UART is
# open), printk returns immediately rather than spinning forever.
# UART console is unaffected — output always appears there regardless.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=256
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y

# ── System stacks ─────────────────────────────────────────────────────────
# main() calls k_thread_create×4 + printk×8; needs ~512 B.
# idle: on RISC-V M-mode (no separate ISR stack), timer interrupts run on
# the idle thread's stack.  With SystemView hooks firing on every IRQ,
# 512 B is the safe minimum.
CONFIG_MAIN_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=512
