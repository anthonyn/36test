# Serial console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Thread name support (shows up in k_thread_name_set / kernel logs)
CONFIG_THREAD_NAME=y

# Debug — keep a linked list of all threads and export struct offsets to GDB
CONFIG_DEBUG_THREAD_INFO=y      # exports _thread_info offsets; implies THREAD_MONITOR
CONFIG_DEBUG_OPTIMIZATIONS=y   # compiles with -Og: debug-friendly without blowing stacks
CONFIG_STACK_SENTINEL=y        # writes a magic value at stack bottom; kernel panics early on overflow

# Random number generator — needed for sys_rand32_get() in mock_irq_fn.
# TEST_RANDOM_GENERATOR provides a deterministic PRNG on targets that have
# no hardware entropy source (e.g. qemu_riscv32).  On hifive1_revb this
# falls back gracefully if a hardware source is found.
CONFIG_TEST_RANDOM_GENERATOR=y
